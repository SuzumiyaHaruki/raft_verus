# DRAFT. Paths are local examples; override with MADRAFT_VERUS, MADRAFT_RUST_BIN,
# MADRAFT_RUSTUP_HOME and MADRAFT_CARGO_HOME. No tool is installed by a helper.
[tools]
codex = codex
verus = /home/nitro/.local/share/raft-verus/verus-x86-linux/verus
rust_bin = /home/nitro/.local/share/raft-verus/rustup/toolchains/1.92.0-x86_64-unknown-linux-gnu/bin
rustup_home = /home/nitro/.local/share/raft-verus/rustup
cargo_home = target/madraft-cargo

[agent]
# Explicit experiment model; --model overrides it. Empty uses the CLI default.
model = gpt-6-astra
reasoning_effort = high
total_seconds = 3600
max_log_bytes = 16777216

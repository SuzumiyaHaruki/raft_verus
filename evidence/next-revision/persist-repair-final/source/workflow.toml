outputs = ["crates/raft-verified/tests/replay_cases.rs"]
obligations = []
checks = ["reconcile-tests", "reconcile-replay"]

[tasks.INTEGRATION-MEASURE]
module = "input/integration.md"
step = "Measure reconciliation cost"
status = "ready"
kind = "benchmark"
after = ["REPLICATION-RECONCILE", "REPLICATION-REPLAY", "REPLICATION-PROOF"]
context = ["crates/raft-verified/src/reconcile.rs", "crates/raft-verified/check.py", "crates/raft-verified/examples/measure_reconcile.rs"]
edit = ["review/measurements/"]
outputs = ["review/measurements/reconciliation.md"]
obligations = []
checks = ["reconcile-bench"]

[tasks.STATE-INIT]
module = "input/state.md"
step = "Initialize node state"
status = "ready"
kind = "implementation"
after = []
context = ["input/model.md", "input/io.md", "crates/raft-verified/src", "crates/raft-verified/tests/node_init.rs", "crates/raft-spec/src", "crates/raft-proofs/node_init.rs", "crates/raft-verified/examples/initialize.rs"]
edit = ["crates/raft-verified/src/node.rs"]
outputs = ["crates/raft-verified/src/node.rs"]
obligations = ["LOCAL-NODE-INIT"]
checks = ["interface-check", "node-tests", "node-replay", "spec", "node-proof", "reconcile-proof", "node-bench"]

[tasks.RUNTIME-PERSIST]
module = "input/runtime.md"
step = "Coordinate persistence and completions"

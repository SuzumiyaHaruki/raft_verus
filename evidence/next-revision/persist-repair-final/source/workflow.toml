[tasks.REPLICATION-RECONCILE]
module = "input/replication.md"
step = "Reconcile log contents"
status = "ready"
kind = "implementation"
after = []
context = ["Cargo.toml", "Cargo.lock", "crates/raft-verified/Cargo.toml", "input/model.md", "input/io.md", "crates/raft-verified/src", "crates/raft-verified/tests", "crates/raft-spec/src/lib.rs"]
edit = ["crates/raft-verified/src/reconcile.rs"]
outputs = ["crates/raft-verified/src/reconcile.rs"]
obligations = []
checks = ["interface-check", "reconcile-tests", "reconcile-replay", "reconcile-proof", "reconcile-bench"]

[tasks.REPLICATION-PROOF]
module = "input/replication.md"
step = "Prove reconciliation correspondence"
status = "ready"
kind = "proof"
after = ["REPLICATION-RECONCILE"]
context = ["input/model.md", "input/proofs.md", "crates/raft-spec/src/lib.rs", "crates/raft-verified/src/reconcile.rs", "crates/raft-proofs"]

[checks.node-replay]
kind = "initialization-scenario"
purpose = "test"
adapter = "command-text-v1"
argv = ["python3", "crates/raft-verified/check.py", "node-replay"]
entrypoints = ["crates/raft-verified/examples/initialize.rs", "crates/raft-verified/check.py"]
source_inputs = ["Cargo.toml", "Cargo.lock", "crates/raft-verified"]
expected_targets = ["construct three independent nodes and reject an unknown identity"]
expected_obligation_ids = []

kind = "implementation"
after = ["STATE-INIT"]
context = ["input/io.md", "input/model.md", "crates/raft-verified/src", "crates/raft-verified/tests/persistence.rs", "crates/raft-verified/examples/persistence.rs", "crates/raft-verified/examples/persistence.trace", "crates/raft-spec/src/persistence.rs", "crates/raft-proofs/persistence.rs"]

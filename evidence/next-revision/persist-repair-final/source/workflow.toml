# DRAFT. Module assignments live in input/*.md; each task selects one named step.
# Prepared for an explicitly started experiment. Review delivered code afterward.
[workflow]
allow_real_codex = true
isolation = "local-development"
context = []
protected_paths = ["AGENTS.md", "Cargo.toml", "Cargo.lock", "input", "workflow.toml", "crates/raft-spec", "crates/proof-smoke", "crates/raft-proofs/reconcile.rs", "crates/raft-proofs/node_init.rs", "crates/raft-verified/src/state.rs", "crates/raft-verified/src/io.rs", "crates/raft-proofs/persistence.rs", "crates/raft-proofs/progress.rs", "crates/raft-verified/tests/persistence.rs", "crates/raft-verified/tests/node_init.rs", "orchestrator", "crates/raft-verified/check.py", "crates/raft-verified/tests/reconcile.rs", "crates/raft-verified/examples"]

[codex]
executable = "codex"
supported_versions = ["codex-cli 0.162.0-alpha.17.2"]
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
# One-run overrides: python3 -m orchestrator --model gpt-6.1-sol --reasoning-effort high ...

[budget]
stalled_attempts = 2
max_redesigns = 1
max_agent_calls = 3
max_repair_rounds = 2
call_timeout_seconds = 600
task_timeout_seconds = 2400
max_log_bytes = 1048576

[budgets.proof]
max_agent_calls = 3
max_repair_rounds = 2
call_timeout_seconds = 600
task_timeout_seconds = 2400

[budgets.benchmark]
max_agent_calls = 2
max_repair_rounds = 1
call_timeout_seconds = 300
task_timeout_seconds = 1200

[local_obligations]
LOCAL-PERSIST = "Exact executable submit/completion/partial dispatcher contracts, including matching, withholding, fresh identity and fail-stop errors; not legal Raft transitions."
LOCAL-PERSIST-VIEW = "Submitted images and successful callbacks correspond to the storage projection; host durability and legal caller transitions remain external obligations."
LOCAL-PROGRESS = "A fairly serviced matching successful completion releases its pending reply through actual dispatcher contracts, under explicit noninterference; not global Raft liveness."
LOCAL-NODE-INIT = "Every valid fixed membership constructs the initial node fields corresponding to fresh_node; invalid membership is rejected. Initialization only; no full node or cluster refinement."
LOCAL-RECONCILE = "Executable log reconciliation corresponds to merged and preserves the prefix; not global log matching."

[toolchain]
install_root = "~/.local/share/raft-verus"
lifecycle_status = "DRAFT"
codex_observed = "codex-cli 0.162.0-alpha.17.2"
verus = "0.2026.01.23.1650a05"
verus_commit = "1650a05d64219fdd1d150f32d0d7d5b19b8defcd"
rust_for_verus = "1.92.0-x86_64-unknown-linux-gnu"
z3 = "4.12.5"
verus_tla = "NOT_FOUND_NOT_COMPATIBILITY_CHECKED"
python_minimum = "3.10"

[verus_calibration]
tool_version = "Verus\n  Version: 0.2026.01.23.1650a05\n  Profile: release\n  Platform: linux_x86_64\n  Toolchain: 1.92.0-x86_64-unknown-linux-gnu"
summary_pattern = "(?m)^verification results:: (?P<verified>[0-9]+) verified, (?P<errors>[0-9]+) errors$"
positive_evidence = "evidence/model-verus-positive-1.stdout.txt"
negative_evidence = "evidence/model-verus-negative-1.stdout.txt"
run_metadata = "evidence/model-verus-runs-1.json"

[checks.smoke-positive]
kind = "proof-smoke"
purpose = "proof"
adapter = "verus-calibrated-text-v1"
argv = ["{verus}", "--crate-type", "lib", "crates/proof-smoke/positive.rs"]
entrypoints = ["crates/proof-smoke/positive.rs"]
expected_targets = ["successor", "successor_is_larger", "increment"]
expected_obligation_ids = []
minimum_verified = 2

[checks.smoke-negative]
kind = "negative-proof-smoke"
purpose = "proof"
adapter = "verus-calibrated-text-v1"
argv = ["{verus}", "--crate-type", "lib", "crates/proof-smoke/negative.rs"]
entrypoints = ["crates/proof-smoke/negative.rs"]
expected_targets = ["wrong_increment"]
expected_obligation_ids = []
expect_rejection = true
rejection_pattern = '(?s)error: postcondition not satisfied.*crates/proof-smoke/negative\.rs:[0-9]+:[0-9]+.*ensures result == n'

[checks.spec]
kind = "candidate-model-typecheck"
purpose = "typecheck"
adapter = "verus-calibrated-text-v1"
argv = ["{verus}", "--crate-type", "lib", "crates/raft-spec/src/lib.rs"]
entrypoints = ["crates/raft-spec/src/lib.rs"]
expected_targets = ["init", "next", "election_safety", "log_matching"]
expected_obligation_ids = []

[checks.interface-check]
source_inputs = ["Cargo.toml", "Cargo.lock", "crates/raft-verified/Cargo.toml", "crates/raft-verified/src", "crates/raft-verified/check.py"]
kind = "build-only"
purpose = "build"
adapter = "command-text-v1"
argv = ["python3", "crates/raft-verified/check.py", "build"]
entrypoints = ["crates/raft-verified/src/lib.rs", "crates/raft-verified/src/reconcile.rs", "crates/raft-verified/check.py"]
expected_targets = ["raft-verified"]
expected_obligation_ids = []
success_pattern = "Finished.*dev"

[checks.full]
kind = "full-raft-verification"
purpose = "proof"
adapter = "verus-calibrated-text-v1"
argv = ["{verus}", "--crate-type", "lib", "crates/raft-proofs/src/lib.rs"]
entrypoints = ["crates/raft-spec/src/lib.rs", "crates/raft-verified/src/lib.rs", "crates/raft-proofs/README.md"]
planned_entrypoints = ["crates/raft-proofs/src/lib.rs"]
expected_targets = ["all-exec-refinement", "all-safety", "all-liveness", "liveness-preservation"]
expected_obligation_ids = ["PO-INIT", "PO-AUX-INDEX", "PO-AUX-TERM", "PO-AUX-VOTE", "PO-AUX-COMMIT", "PO-AUX-TOKEN", "PO-REQUEST", "PO-RECOVERY", "PO-STEP", "PO-DELIVERY", "PO-S-ELECTION", "PO-S-APPEND", "PO-S-LOG", "PO-S-COMPLETE", "PO-S-INTERFACE", "PO-S-APPLY", "PO-REPRESENTATION", "PO-REFINE-INIT", "PO-IO", "PO-REFINE-STEP", "PO-COMPOSITION", "PO-L-ELECTION", "PO-L-COMMIT", "PO-L-DELIVER", "PO-LIVE-REFINEMENT", "PO-COVERAGE"]
stage = "planned"
contract_status = "DRAFT"
required_isolation = "external"

[checks.reconcile-tests]
source_inputs = ["Cargo.toml", "Cargo.lock", "crates/raft-verified/Cargo.toml", "crates/raft-verified/src", "crates/raft-verified/check.py", "crates/raft-verified/tests", "crates/raft-verified/examples/replay.rs", "crates/raft-verified/examples/reconcile.trace"]
kind = "functional-tests"
purpose = "test"
adapter = "command-text-v1"
argv = ["python3", "crates/raft-verified/check.py", "test", "--lib", "--test", "reconcile", "--test", "replay_cases"]
entrypoints = ["Cargo.toml", "Cargo.lock", "crates/raft-verified/Cargo.toml", "crates/raft-verified/src/lib.rs", "crates/raft-verified/src/reconcile.rs", "crates/raft-verified/tests/reconcile.rs", "crates/raft-verified/tests/replay_cases.rs", "crates/raft-verified/examples/replay.rs", "crates/raft-verified/examples/reconcile.trace", "crates/raft-verified/check.py"]
expected_targets = ["reconciliation edge cases and interface regressions"]
expected_obligation_ids = []
success_pattern = "test result: ok"
timeout_seconds = 300

[checks.reconcile-proof]
source_inputs = ["crates/raft-proofs/reconcile.rs", "crates/raft-proofs/reconcile_lemmas.rs", "crates/raft-spec/src/lib.rs", "crates/raft-spec/src/reconcile_view.rs", "crates/raft-verified/src/reconcile.rs", "crates/raft-verified/src/lib.rs", "crates/raft-verified/check.py", "crates/raft-verified/Cargo.toml"]
kind = "local-correspondence"
purpose = "proof"
adapter = "verus-calibrated-text-v1"
argv = ["{verus}", "--crate-type", "lib", "--no-cheating", "--output-json", "--time-expanded", "--triggers-mode", "silent", "crates/raft-proofs/reconcile.rs"]
entrypoints = ["crates/raft-proofs/reconcile.rs", "crates/raft-proofs/reconcile_lemmas.rs", "crates/raft-verified/src/reconcile.rs", "crates/raft-spec/src/lib.rs", "crates/raft-spec/src/reconcile_view.rs"]
proof_entrypoints = ["crates/raft-proofs/reconcile.rs", "crates/raft-verified/src/reconcile.rs"]
expected_targets = ["check_reconcile_contract", "reconcile_log"]
expected_obligation_ids = ["LOCAL-RECONCILE"]
proof_targets = { LOCAL-RECONCILE = "reconcile::check_reconcile_contract" }
minimum_verified = 1
timeout_seconds = 300

[checks.reconcile-replay]
source_inputs = ["Cargo.toml", "Cargo.lock", "crates/raft-verified/Cargo.toml", "crates/raft-verified/src", "crates/raft-verified/check.py", "crates/raft-verified/examples/replay.rs", "crates/raft-verified/examples/reconcile.trace"]
kind = "local-scenario"
purpose = "test"
adapter = "command-text-v1"
argv = ["python3", "crates/raft-verified/check.py", "replay"]
entrypoints = ["crates/raft-verified/src/reconcile.rs", "crates/raft-verified/examples/replay.rs", "crates/raft-verified/examples/reconcile.trace", "crates/raft-verified/check.py"]
expected_targets = ["deterministic reconciliation replay"]
scenario = { seed = 17, trace_path = "crates/raft-verified/examples/reconcile.trace", boundary = "Local log reconciliation only; no network, timer, crash or persistence simulation." }
expected_obligation_ids = []
success_pattern = "REPLAY_PASS"
selected_count_pattern = "REPLAY_PASS.*steps=(?P<count>[0-9]+)"
timeout_seconds = 300

[checks.reconcile-bench]
source_inputs = ["Cargo.toml", "Cargo.lock", "crates/raft-verified/Cargo.toml", "crates/raft-verified/src", "crates/raft-verified/check.py", "crates/raft-verified/examples/measure_reconcile.rs"]
kind = "core-microbenchmark"
purpose = "benchmark"
adapter = "command-text-v1"
argv = ["python3", "crates/raft-verified/check.py", "bench"]
entrypoints = ["crates/raft-verified/src/reconcile.rs", "crates/raft-verified/examples/measure_reconcile.rs", "crates/raft-verified/check.py"]
expected_targets = ["core reconciliation measurements at several log lengths"]
expected_obligation_ids = []
timeout_seconds = 300

[checks.node-tests]
kind = "functional-tests"
purpose = "test"
adapter = "command-text-v1"
argv = ["python3", "crates/raft-verified/check.py", "test"]
entrypoints = ["crates/raft-verified/tests/node_init.rs", "crates/raft-verified/check.py"]
source_inputs = ["Cargo.toml", "Cargo.lock", "crates/raft-verified"]
expected_targets = ["node initialization and existing runtime regressions"]
expected_obligation_ids = []
success_pattern = "test result: ok"
minimum_tests = 23

[checks.node-proof]
kind = "local-correspondence"
purpose = "proof"
adapter = "verus-calibrated-text-v1"
argv = ["{verus}", "--crate-type", "lib", "--no-cheating", "--output-json", "--time-expanded", "--triggers-mode", "silent", "crates/raft-proofs/node_init.rs"]
entrypoints = ["crates/raft-proofs/node_init.rs", "crates/raft-verified/src/node.rs", "crates/raft-verified/src/state.rs", "crates/raft-verified/src/reconcile.rs", "crates/raft-spec/src/lib.rs", "crates/raft-spec/src/reconcile_view.rs", "crates/raft-spec/src/node_init.rs"]
source_inputs = ["Cargo.toml", "Cargo.lock", "crates/raft-verified", "crates/raft-spec", "crates/raft-proofs/node_init.rs"]

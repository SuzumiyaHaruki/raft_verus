argv = ["python3", "crates/raft-verified/check.py", "persist-replay"]
entrypoints = ["crates/raft-verified/examples/persistence.rs", "crates/raft-verified/examples/persistence.trace"]
source_inputs = ["Cargo.toml", "Cargo.lock", "crates/raft-verified"]
expected_targets = ["delayed duplicate stale wrong-kind and reordered coordinator completions"]
expected_obligation_ids = []
scenario = { seed = 0, trace_path = "crates/raft-verified/examples/persistence.trace", boundary = "Actual partial Node dispatcher; separate host disk and callback; no implemented crash recovery or cluster." }
success_pattern = "PERSIST_REPLAY_PASS"
selected_count_pattern = "PERSIST_REPLAY_PASS steps=(?P<count>[0-9]+)"
minimum_tests = 14

[checks.persist-bench]
purpose = "benchmark"
adapter = "command-text-v1"
argv = ["python3", "crates/raft-verified/check.py", "persist-bench"]
entrypoints = ["crates/raft-verified/examples/persistence.rs"]
source_inputs = ["Cargo.toml", "Cargo.lock", "crates/raft-verified"]
expected_targets = ["coordinator submission and completion cost; no storage or cluster throughput"]
expected_obligation_ids = []

[checks.progress-proof]
purpose = "proof"
adapter = "verus-calibrated-text-v1"
argv = ["{verus}", "--crate-type", "lib", "--no-cheating", "--output-json", "--time-expanded", "--triggers-mode", "silent", "crates/raft-proofs/progress.rs"]
entrypoints = ["crates/raft-proofs/progress.rs", "crates/raft-proofs/progress_lemmas.rs", "crates/raft-verified/src/persistence.rs", "crates/raft-spec/src/persistence.rs", "crates/raft-spec/src/progress.rs"]
source_inputs = ["crates/raft-verified", "crates/raft-spec", "crates/raft-proofs/progress.rs", "crates/raft-proofs/progress_lemmas.rs"]
proof_entrypoints = ["crates/raft-proofs/progress.rs"]
expected_targets = ["check_local_progress", "check_step", "waiting_prefix", "release_after_service"]
expected_obligation_ids = ["LOCAL-PROGRESS"]
proof_targets = { LOCAL-PROGRESS = "progress::check_local_progress" }
minimum_verified = 1

[tasks.PROGRESS-FOUNDATION]
module = "input/progress.md"
step = "Establish coordinator progress foundation"
status = "ready"
kind = "proof"
after = ["RUNTIME-PERSIST"]
context = ["input/assumptions.md", "input/io.md", "crates/raft-verified/src/persistence.rs", "crates/raft-spec/src/progress.rs", "crates/raft-spec/src/persistence.rs", "crates/raft-proofs/progress.rs"]
edit = ["crates/raft-proofs/progress_lemmas.rs"]
outputs = ["crates/raft-proofs/progress_lemmas.rs"]
obligations = ["LOCAL-PROGRESS"]
checks = ["persist-proof", "progress-proof", "persist-tests", "persist-replay"]

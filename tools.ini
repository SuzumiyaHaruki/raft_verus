# DRAFT. Paths are local examples; override with MADRAFT_VERUS, MADRAFT_RUST_BIN,
# MADRAFT_RUSTUP_HOME and MADRAFT_CARGO_HOME. No tool is installed by a helper.
[tools]
codex = codex
verus = /home/nitro/.local/share/raft-verus/verus-x86-linux/verus
rust_bin = /home/nitro/.local/share/raft-verus/rustup/toolchains/1.92.0-x86_64-unknown-linux-gnu/bin
rustup_home = /home/nitro/.local/share/raft-verus/rustup
cargo_home = target/madraft-cargo

[agent]
# Explicit experiment model; --model overrides it. An empty model is rejected.
model = gpt-6-astra
reasoning_effort = high
guidance = B
total_seconds = 3600
max_log_bytes = 16777216
slice_seconds = 600
check_seconds = 300
final_seconds = 600
min_work_seconds = 120
handoff_seconds = 60
max_rounds = 8
stall_rounds = 2
max_redesigns = 1

[checks]
# Every final candidate is tested with this complete set, on the same source.
seeds = 1,2,3,4,5

# Independent serial phase reservations; no test can consume formal time.
functional_fraction = 0.4
build_seconds = 120
test_case_seconds = 45
proof_case_seconds = 45
feedback_rotation = 1

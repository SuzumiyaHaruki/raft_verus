outputs = ["crates/raft-proofs/reconcile_lemmas.rs"]
obligations = ["LOCAL-RECONCILE"]
checks = ["spec", "reconcile-proof"]

[tasks.REPLICATION-REPLAY]
module = "input/replication.md"
step = "Replay reconciliation regressions"
status = "ready"
kind = "scenario"
after = ["REPLICATION-RECONCILE"]
context = ["input/model.md", "crates/raft-verified/src/reconcile.rs", "crates/raft-verified/tests", "crates/raft-verified/examples"]

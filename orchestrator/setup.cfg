[metadata]
name = raft-workflow
version = 0.1.0
description = DRAFT incremental Rust Raft development workflow

[options]
python_requires = >=3.10
package_dir =
    orchestrator = .
packages = orchestrator
install_requires =
    jsonschema>=3.2
    tomli>=2; python_version < "3.11"

[options.package_data]
orchestrator = wire/*.json

[options.entry_points]
console_scripts =
    raft-workflow = orchestrator.cli:main
